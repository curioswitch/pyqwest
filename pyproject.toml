[project]
name = "pyqwest"
version = "0.12.0"
description = "A modern, high-performance HTTP client for Python and Rust."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["opentelemetry-api >=1.39.1"]

[project.urls]
Changelog = "https://github.com/curioswitch/pyqwest/releases"
Homepage = "https://github.com/curioswitch/pyqwest"
Issues = "https://github.com/curioswitch/pyqwest/issues"
Repository = "https://github.com/curioswitch/pyqwest.git"

[dependency-groups]
dev = [
  "aiohttp[speedups]==3.14.4",
  "anyio==4.15.1",
  "asgiref==3.12.1",
  "brotli==1.2.0",
  # Used in setup_it.py, not directly, keeping it here allows renovate for free.
  "connectrpc==0.12.1",
  "httpx[http2]==0.28.1",
  "maturin==1.15.0",
  "opentelemetry-test-utils==0.66b1",
  "outcome==1.3.0.post0",
  "poethepoet==0.48.0",
  "psutil==7.2.2",
  "pytest==9.1.1",
  "pytest-benchmark==5.3.0",
  "pytest-cov==7.1.0",
  "pytest-order==1.5.0",
  "pyvoy==1.3.0",
  "ruff==0.16.10",
  "sniffio==1.3.1",
  "trio==0.34.0",
  "trustme==1.2.1",
  "ty==0.0.85",
  "uvloop==0.23.0; sys_platform != 'win32'",
  "winloop==0.8.0; sys_platform == 'win32'",
  "zstd==1.5.7.2",
]

docs = ["mkdocstrings-python", "zensical"]

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pyqwest._pyqwest"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--benchmark-skip",
  "--benchmark-group-by=func,param:http_scheme,param:http_version,param:content_size",
]
markers = [
  "asyncio_only: the test exercises code that calls asyncio directly, so it runs on no other backend",
]
testpaths = ["tests"]

[tool.ruff.format]
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
  # Same order as listed on https://docs.astral.sh/ruff/rules/
  "YTT",
  "ANN",
  "ASYNC",
  "S",
  "FBT",
  "B",
  "A",
  "COM818",  # Other comma rules are handled by formatting
  "C4",
  "DTZ",
  "T10",
  "EM",
  "EXE",
  "FA",
  "ISC",
  "ICN",
  "LOG",
  "G",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "Q004",  # Other quote rules are handled by formatting
  "RSE",
  "RET",
  # This rule is a bit strict since accessing private members within this package can be
  # useful to reduce public API exposure. But it is important to not access private members
  # of dependencies like httpx so we enable it and ignore the locations where we need to.
  "SLF",
  "SIM",
  "SLOT",
  "TID",
  # TODO: Update TODOs then enable
  # "TD",
  "TC",
  "ARG",
  "PTH",
  "FLY",
  "I",
  "N",
  "PERF",
  "E",
  "W",
  # TODO: Flesh out docs and enable
  # "DOC"
  # "D",
  "F",
  "PGH",
  "PLC",
  "PLE",
  "PLW",
  "UP",
  "FURB",
  "RUF",
  "TRY",
]

# Document reasons for ignoring specific linting errors
ignore = [
  # Not applicable
  "AIR",
  # Dangerous false positives https://github.com/astral-sh/ruff/issues/4845
  "ERA",
  # Not Applicable
  "FAST",
  # Important to call user callbacks safely
  "BLE",
  # stdlib includes a module named code. This is less of an issue since users need to import a module so allow it
  "A005",
  # TODO: Consider using copyright headers
  "CPY",
  # Not Applicable
  "DJ",
  # It's fine to have TODOs
  "FIX",
  # Not Applicable
  "INT",
  # Even prevents pytest.raises around an iteration which is too strict
  "PT012",
  # Triggers for protocol implementations that don't need the arg too
  "ARG002",
  # Complexity checks usually reduce readability
  "C90",
  # Not Applicable
  "NPY",
  # Not Applicable
  "PD",
  # We use the Exception suffix instead
  "N818",
  # Handled by formatting
  "E111",
  "E114",
  "E117",
  "E501",
  "W191",
  # Low signal-to-noise ratio
  "PLR",
  # Code is native only so we need docstrings in the stubs
  "PYI021",
]

typing-extensions = false

[tool.ruff.lint.per-file-ignores]
"scripts/**.py" = ["S603", "S607"]
"**/test_*.py" = [
  "ANN",
  "S101",
  "S603",
  "S607",
  "FBT",
  "EM",
  "INP",
  "SLF",
  "PERF",
  "D",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[tool.ty.src]
exclude = ["tests/test_benchmark.py"]
