[package]
name = "pyqwest"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]
name = "pyqwest"

[dependencies]
arc-swap = "1.9.2"
backoff = "0.4.0"
brotli = "9.0.0"
bytes = "1.12.1"
errors = "0.1.0"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
h2 = "0.4.19"
h3 = "0.0.8"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
# Only used to classify reqwest's errors; must track the version reqwest depends on.
hyper = { version = "1.11.1", features = ["client", "http1"] }
mime = "0.3.17"
pyo3 = { version = "0.29.2", features = ["bytes"] }
reqwest = {
  version = "0.13.5",
  features = [
    "brotli",
    "cookies",
    "gzip",
    "hickory-dns",
    "http2",
    "http3",
    "socks",
    "stream",
    "zstd",
  ]
}
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1.19"
url = "2.5.8"
zstd = "0.14.0"

[build-dependencies]
pyo3-build-config = { version = "0.29.2", features = ["resolve-config"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
unused_trait_names = "deny"
